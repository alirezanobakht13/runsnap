[project]
name = "exp-track"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alirezanobakht13", email = "a.nobakht13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4",
    "mlflow>=3.16.0",
    "pydantic>=2",
    "tensorboard>=2.21.0",
    "tensorboardx>=2.6.5",
]

[project.scripts]
exp-track = "exp_track._cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
